<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Edit Profile</h4>
                    </div>
                    <div class="card-body">
                        <form action="/student/profile/update/{{ student.id }}" method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" class="form-control" value="{{ student.user.email }}" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" name="department" class="form-control" value="{{ student.department }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">CGPA</label>
                                <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ student.cgpa }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Upload Resume (PDF only)</label>
                                {% if student.resume %}
                                    <div class="mb-2">
                                        <small>Current Resume: <a href="/static/uploads/{{ student.resume }}" target="_blank">View PDF</a></small>
                                    </div>
                                {% endif %}

                                <input type="file" name="resume" class="form-control" accept=".pdf">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="/student/dashboard/{{ student.id }}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success px-4">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
