<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>{{ company.company_name }} - Current Openings</h2>
            <a href="/student/dashboard/{{ student_id }}" class="btn btn-outline-dark">Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Drive Name</th>
                            <th>Job Title</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if drives %}
                            {% for drive in drives %}
                            <tr>
                                <td>{{ drive.drive_name }}</td>
                                <td>{{ drive.job_title }}</td>
                                <td class="text-end">
                                    <a href="/student/drive/{{ drive.id }}/{{ student_id }}" 
                                       class="btn btn-primary btn-sm">View Details</a>
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr><td colspan="3" class="text-center text-muted">No active drives for this company.</td></tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
