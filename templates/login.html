{% extends "admin_base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Login Form</h4>
            </div>
            <div class="card-body p-4">
                {% if msg %}
                    <div class="alert alert-danger">{{ msg }}</div>
                {% endif %}
                {% if msg1 %}
                    <div class="alert alert-warning">{{ msg1 }}</div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="user@gmail.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="123" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <small>Do not have an account? <a href="/">Register</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
