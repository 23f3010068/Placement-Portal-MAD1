<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drive Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Applications for: {{ drive.job_title }}</h3>
            <a href="/company/dashboard/{{ company_id }}" class="btn btn-outline-dark">Back to Dashboard</a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if applications %}
                            {% for app in applications %}
                            <tr>
                                <td>{{ app.student.full_name }}</td>
                                <td class="text-end">
                                    <a href="/company/application/review/{{ app.id }}/{{ company_id }}" 
                                       class="btn btn-info btn-sm text-white">Review Application</a>
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr><td colspan="2" class="text-center">No applications received yet</td></tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
